<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGODA-PUINAVE</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:#fff;padding:24px;border-bottom:1px solid #ddd}
main{max-width:1100px;margin:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}
.native{font-size:26px;font-weight:bold;margin-top:8px}
.translation{font-size:18px;margin-top:8px}
.pronunciation{opacity:.75;margin-top:6px}
.id{font-size:12px;opacity:.6}
audio{width:100%;margin-top:14px}
.summary{background:#fff;padding:14px;border-radius:10px;margin-bottom:20px}
</style>
</head>
<body>
<header>
<h1>SGODA-PUINAVE</h1>
<p>Tecnología para preservar la memoria del pueblo Puinave.</p>
</header>
<main>
<h2>Piloto funcional — 25 palabras</h2>
<div id="summary" class="summary">Cargando...</div>
<div id="words" class="grid"></div>
</main>
<script>
async function loadPilot(){
  const summary=document.getElementById("summary");
  const words=document.getElementById("words");
  try{
    const response=await fetch("/api/demo/pilot25");
    if(!response.ok) throw new Error("API "+response.status);
    const payload=await response.json();
    const s=payload.summary;
    summary.textContent=
      `Registros ${s.records}/25 · Datos ${s.lexical_complete}/25 · Audios ${s.audio_complete}/25`;
    payload.records.forEach(item=>{
      const card=document.createElement("article");
      card.className="card";
      const player=item.audio_url
        ? `<audio controls preload="none" src="${item.audio_url}"></audio>`
        : `<p>Audio no disponible</p>`;
      card.innerHTML=`
        <div class="id">${item.lexical_id}</div>
        <div class="native">${item.puinave || ""}</div>
        <div class="pronunciation">${item.pronunciation || ""}</div>
        <div class="translation">${item.spanish || ""}</div>
        ${player}`;
      words.appendChild(card);
    });
  }catch(error){
    summary.textContent="Error cargando SGODA: "+error.message;
  }
}
loadPilot();
</script>
</body>
</html>
