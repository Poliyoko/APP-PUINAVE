name: UTF-8 Repository Compliance

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  utf8-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit UTF-8 repository compliance
        env:
          PYTHONPATH: src
        run: |
          python -m sgoda.pmo.utf8.repository_utf8 --root .