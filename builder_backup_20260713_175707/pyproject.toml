[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sgoda-builder"
version = "0.2.0"
description = "SGODA Project Builder - Herramienta oficial para construir el ecosistema SGODA-PUINAVE"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Proyecto SGODA-PUINAVE"}
]

keywords = [
    "sgoda",
    "builder",
    "data-governance",
    "dama",
    "puinave"
]

dependencies = []

[project.scripts]
sgoda = "sgoda.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
