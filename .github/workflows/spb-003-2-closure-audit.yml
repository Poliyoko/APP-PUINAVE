name: SPB-003.2 Strict Closure Audit

on:
  push:
    branches: [main, "feature/SPB-003.2-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pmo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMO test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run PMO audit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/pmo/audit
      - name: Run strict repository audit
        env:
          PYTHONPATH: src
        run: python -m sgoda.pmo.audit.cli --repository . --output artifacts/audit/spb-003.2
      - name: Upload PMO audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spb-003-2-audit-evidence
          path: artifacts/audit/spb-003.2

  builder-tests:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('builder/pyproject.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Builder
        working-directory: builder
        run: python -m pip install -e . pytest
      - name: Run Builder tests
        working-directory: builder
        run: python -m pytest -q

  closure-decision:
    runs-on: ubuntu-latest
    needs: [pmo-audit, builder-tests]
    if: ${{ always() && needs.pmo-audit.result == 'success' && (needs.builder-tests.result == 'success' || needs.builder-tests.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Generate closure decision
        env:
          PYTHONPATH: src
        run: python -m sgoda.pmo.closure.closure_orchestrator --root . --output artifacts/closure/spb-003.2
